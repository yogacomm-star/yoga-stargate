name = "yoga-stargate-public"
main = ".open-next/worker.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "yogastargate.com", custom_domain = true },
  { pattern = "www.yogastargate.com", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
